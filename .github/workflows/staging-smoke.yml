name: Staging Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    environment: staging
    env:
      STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
      STAGING_WORKSPACE_ID: ${{ vars.STAGING_WORKSPACE_ID }}
      STAGING_ACCESS_TOKEN: ${{ secrets.STAGING_ACCESS_TOKEN }}
      STAGING_METRICS_BEARER_TOKEN: ${{ secrets.STAGING_METRICS_BEARER_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Install uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.9.26"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"
      - name: Install runtime dependencies
        working-directory: backend
        run: uv sync --frozen --no-dev
      - name: Run read-only staging checks
        working-directory: backend
        run: uv run python scripts/staging_smoke.py
